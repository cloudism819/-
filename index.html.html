<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自動詞・他動詞チェック</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#222;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--bluebg:#eff6ff;--orange:#c2410c;--orangebg:#fff7ed;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.65}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.searchbox{position:sticky;top:0;background:rgba(247,247,245,.96);padding:8px 0 14px;z-index:5}
input{width:100%;font-size:18px;padding:13px 14px;border:1px solid #d1d5db;border-radius:12px;background:white;outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.suggestions button{border:1px solid var(--line);background:white;border-radius:999px;padding:6px 10px;font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.badge{display:inline-block;font-weight:700;font-size:13px;border-radius:999px;padding:4px 9px;margin-bottom:8px}
.badge.trans{background:var(--orangebg);color:var(--orange)}
.badge.intrans{background:var(--bluebg);color:var(--blue)}
.word{font-size:27px;font-weight:700;margin:0}
.reading{font-size:14px;color:var(--muted);margin-left:6px;font-weight:400}
.section{margin-top:15px}
.label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.example{font-size:19px;margin-top:2px}
.pair{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.pairword{font-size:20px;font-weight:700}
.note{font-size:13px;color:#6b7280;background:#f9fafb;border-radius:10px;padding:9px 11px;margin-top:13px}
.empty{text-align:center;color:var(--muted);padding:34px 8px}
.count{font-size:13px;color:var(--muted);margin:8px 0}
ruby rt{font-size:.52em;font-weight:500}
@media(max-width:480px){main{padding:18px 12px 36px}h1{font-size:22px}.word{font-size:25px}.example{font-size:18px}}
</style>
</head>
<body>

<div id="count" class="count"></div>
<div id="results"><div class="empty">動詞を入力してください。</div></div>
</main>

const q=document.getElementById('q');
const results=document.getElementById('results');
const suggestions=document.getElementById('suggestions');
const count=document.getElementById('count');

const norm=s=>(s||'').trim().toLowerCase();
const hira=s=>(s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));

function renderCard(e){
  const badgeClass=e.type==='他動詞'?'trans':'intrans';
  let pairHtml='';
  if(e.pair){
    pairHtml=`<div class="pair">
      <div class="label">ペア</div>
      <div class="pairword">${esc(e.pair)} <span class="reading">（${esc(e.pairReading)}）</span></div>
      <div class="example">${e.pairExampleHtml}</div>
    </div>`;
  } else {
    pairHtml=`<div class="pair"><div class="label">ペア</div><div>なし</div></div>`;
  }
  return `<article class="card">
    <span class="badge ${badgeClass}">${e.type}</span>
    <div class="word">${esc(e.word)} <span class="reading">（${esc(e.reading)}）</span></div>
    <div class="section"><div class="label">例文</div><div class="example">${e.exampleHtml}</div></div>
    ${pairHtml}
    ${e.note?`<div class="note">${esc(e.note)}</div>`:''}
  </article>`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function search(){
  const raw=q.value.trim();
  suggestions.innerHTML='';
  if(!raw){
    count.textContent='';
    results.innerHTML='<div class="empty">動詞を入力してください。</div>';
    return;
  }
  const n=norm(raw), h=hira(n);
  const exact=DATA.filter(e=>norm(e.word)===n||hira(norm(e.reading))===h);
  let found=exact.length?exact:DATA.filter(e=>norm(e.word).includes(n)||hira(norm(e.reading)).includes(h));
  found=found.slice(0,10);

  const sug=DATA.filter(e=>norm(e.word).includes(n)||hira(norm(e.reading)).includes(h))
    .map(e=>e.word+'（'+e.reading+'）');
  [...new Set(sug)].slice(0,8).forEach(s=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=s;
    b.onclick=()=>{q.value=s.split('（')[0]; search(); q.focus();};
    suggestions.appendChild(b);
  });

  if(!found.length){
    count.textContent='';
    results.innerHTML='<div class="empty">見つかりませんでした。</div>';
    return;
  }
  count.textContent=(exact.length?'':'検索結果：')+found.length+'件';
  results.innerHTML=found.map(renderCard).join('');
}
q.addEventListener('input',search);
</script>
